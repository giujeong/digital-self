<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B2620">
<title>일본어 성경 읽기</title>
<meta name="credits" content="Stroke order data: KanjiVG (c) Ulrich Apel, CC BY-SA 3.0. Kanji readings: KANJIDIC (EDRDG, CC BY-SA 4.0).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Shippori+Mincho:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --paper:#EFE8D8; --sheet:#F8F3E7; --ink:#2B2620; --muted:#6E6455; --line:#CDBFA3; --ghost:#E3D9C4;
  --shu:#A9342A; --ai:#2E4A72; --koke:#4C6435; --hl:#EBD58F; --rule:#8C7A5C; --hot:#B8473F;
  --f-kanji:'Klee One','Shippori Mincho',serif;
  --f-ko:'Gowun Batang','Noto Serif KR','AppleMyungjo',serif;
  --f-ja:'Shippori Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1A1713;--sheet:#221E18;--ink:#EAE1CE;--muted:#A89B84;--line:#3F372B;--ghost:#332C22;--shu:#E0705F;--ai:#9DB2D6;--koke:#A9C08A;--hl:#5E4E1E;--rule:#7A6A50;--hot:#C2564C;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1A1713;--sheet:#221E18;--ink:#EAE1CE;--muted:#A89B84;--line:#3F372B;--ghost:#332C22;--shu:#E0705F;--ai:#9DB2D6;--koke:#A9C08A;--hl:#5E4E1E;--rule:#7A6A50;--hot:#C2564C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ko);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 8px;box-shadow:0 6px 10px -10px rgba(0,0,0,.4)}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:1px solid var(--line);background:var(--sheet);padding:8px 0;border-radius:2px;font-weight:700;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .dot{position:absolute;top:5px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--shu)}
.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 14px;border-radius:2px;font-weight:700}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ok{background:var(--koke);color:#fff;border-color:var(--koke)}
.btn.shu{background:var(--hot);color:#fff;border-color:var(--hot)}
.btn[aria-pressed="true"]{background:var(--ai);color:#fff;border-color:var(--ai)}
.note{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:12px 0}.seg .btn{flex:1;padding:8px 4px}
.view[hidden]{display:none}
/* 읽기 */
.rhd{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.rhd b{font-size:19px;margin-right:auto}
.rhd select{font:inherit;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:6px 8px;border-radius:2px}
.prog{height:4px;background:var(--ghost);border-radius:2px;overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:var(--koke)}
.vcard{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:16px}
.vno{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.jp{font-family:var(--f-ja);font-size:23px;line-height:2.25;margin:8px 0 4px;word-break:break-all}
.jp ruby rt{font-size:10.5px;color:var(--muted);font-family:var(--f-ja);letter-spacing:0}
.jp.nofuri rt{visibility:hidden}
.jp .w{cursor:pointer;border-radius:2px}
.jp .w:hover,.jp .w.on{background:var(--hl)}
.jp .k{border-bottom:2px solid var(--ai)}
.jp .k.n{border-bottom-color:var(--shu)}
.jp .k.d{border-bottom-style:dotted}
:root{--tn:#d9e6f5;--ta:#cfeae6;--td:#e4dfd2;--tv:#dcefd9;--tj:#f4ecbc;--tp:#fbe3c8;--tg:#ead9f0;--Tn:#9fc0ea;--Ta:#8fd3c9;--Td:#c9c0a8;--Tv:#a9dca1;--Tj:#e6d26c;--Tp:#f6c08a;--Tg:#d3b2e2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tn:#22324a;--ta:#1d3b37;--td:#35312a;--tv:#22381f;--tj:#3d3618;--tp:#45311c;--tg:#382a40;--Tn:#3b5f94;--Ta:#2f6f66;--Td:#5c5546;--Tv:#3c6b35;--Tj:#7a6a1f;--Tp:#8a5a25;--Tg:#6a4a7c}}
:root[data-theme="dark"]{--tn:#22324a;--ta:#1d3b37;--td:#35312a;--tv:#22381f;--tj:#3d3618;--tp:#45311c;--tg:#382a40;--Tn:#3b5f94;--Ta:#2f6f66;--Td:#5c5546;--Tv:#3c6b35;--Tj:#7a6a1f;--Tp:#8a5a25;--Tg:#6a4a7c}
.al .s{cursor:pointer;border-radius:3px;transition:background .15s,opacity .15s}
.al .gap{display:inline-block;width:.35em}
.acol .s.n,.lg2 .n{background:var(--tn)}.acol .s.a,.lg2 .a{background:var(--ta)}.acol .s.d,.lg2 .d{background:var(--td)}.acol .s.v,.lg2 .v{background:var(--tv)}.acol .s.j,.lg2 .j{background:var(--tj)}.acol .s.p,.lg2 .p{background:var(--tp)}.acol .s.g,.lg2 .g{background:var(--tg)}
.al .s.n.on{background:var(--Tn)}.al .s.a.on{background:var(--Ta)}.al .s.d.on{background:var(--Td)}.al .s.v.on{background:var(--Tv)}.al .s.j.on{background:var(--Tj)}.al .s.p.on{background:var(--Tp)}.al .s.g.on{background:var(--Tg)}
.al.sel .s:not(.on){opacity:.5}
.lg2{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}.lg2 span{font-size:11px;padding:1px 7px;border-radius:999px;color:var(--ink)}
.abar{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:14px;background:var(--paper)}
.abar>*{white-space:nowrap}.abar .t{font-size:12px;padding:1px 8px;border-radius:999px}
.abar .kb{margin-left:auto;display:flex;gap:4px}.abar .kb button{border:1px solid var(--line);background:var(--sheet);border-radius:2px;padding:3px 7px;font-size:13px}
.gn{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:14px}
.gn .gt{font-weight:700;font-size:13px;color:#7d4f93;margin:0 0 6px}
.gn .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;margin:3px 0}.gn .row small{font-size:11px;color:var(--muted);margin-left:auto}
.gn .row i{font-style:normal;border-radius:3px;padding:0 3px;background:var(--tg)}
.gn .tip{margin-top:8px;font-size:12px;border-top:1px dashed var(--line);padding-top:6px}
.ko{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-size:15.5px;line-height:1.7}
.ko.empty{color:var(--muted);font-size:13px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ctl .btn{flex:1}
.leg{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
.leg i{display:inline-block;width:14px;border-bottom:2px solid var(--ai);margin:0 3px 3px 0}.leg i.n{border-color:var(--shu)}
.leg s{text-decoration:none;background:var(--hl);padding:0 4px;border-radius:2px}
.copy{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.copy a{color:inherit}
.done{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--koke);color:#fff}
/* 팝업 */
.pop{position:fixed;inset:0;z-index:50;background:rgba(30,25,20,.45);display:flex;align-items:flex-end;justify-content:center}
.pop[hidden]{display:none}
.pcard{background:var(--sheet);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px 22px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.pk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.rail{display:flex;flex-direction:column;gap:5px}.rail svg{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:2px}
.big{width:150px;height:150px;margin:0 auto;cursor:pointer}.big svg{width:100%;height:100%}
.glyph{font-family:var(--f-kanji);font-size:110px;line-height:150px;text-align:center}
.hun{text-align:center;font-size:20px;font-weight:700}.hun small{font-size:12px;color:var(--muted);font-weight:400}
.parts{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-top:10px;font-size:14px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;font-family:var(--f-ja)}
.chip b{font-family:var(--f-ko);font-weight:400;color:var(--muted);margin-right:4px;font-size:11px}
.wtop{text-align:center}.wtop .ww{font-family:var(--f-ja);font-size:36px;font-weight:700}.wtop .wr{color:var(--muted)}.wtop .wk{font-size:19px;margin-top:6px}
.refs{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
button.chip{cursor:pointer;color:var(--ink)}
.kw{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;text-align:left}
.kw h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.kwi{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kwi:last-child{border-bottom:0}
.kwi .ja,.kw .ja{font-family:var(--f-ja)}
.kwi b{font-size:17px}
.kwm{color:var(--ink)}
.kwp{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin:0 2px}
.kwe{font-size:13px;margin-top:3px;color:var(--ink)}
.kwt{color:var(--muted);font-size:12px}
.say{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);font-size:11px;padding:0 0 0 2px;vertical-align:middle}
/* 홈 */
.hi{font-size:21px;font-weight:700;margin:16px 0 4px}.hi small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:3px}
.card{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:26px}.st span{font-size:12px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.vgrid button{border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:7px 0;font-size:12px}
.vgrid button.r{background:var(--koke);color:#fff;border-color:var(--koke)}
.vgrid button.cur{outline:2px solid var(--ink)}
.fold summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:14px;color:var(--muted);font-weight:700}
.fold summary::-webkit-details-marker{display:none}
.fold summary small{margin-left:auto;font-weight:400}
.fold summary::after{content:'▾';transition:transform .2s}
.fold[open] summary::after{transform:rotate(180deg)}
.fold[open] summary{margin-bottom:10px}
/* 복습 */
.ivl{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.ivl span{border:1px solid var(--line);border-radius:999px;padding:1px 10px}.ivl span.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.q{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:16px;margin-top:10px;text-align:center}
.ql{font-size:13px;color:var(--muted)}
.qk{font-family:var(--f-kanji);font-size:96px;line-height:1.2}
.qw{font-family:var(--f-ja);font-size:40px;font-weight:700}
.qs{font-family:var(--f-ja);font-size:20px;line-height:1.9;margin:6px 0}
.qs mark{background:var(--hl);color:inherit;padding:0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:14px 6px;font-size:18px}
.opt.ja{font-family:var(--f-ja)}.opt.k{font-family:var(--f-kanji);font-size:30px}
.opt.ok{background:var(--koke);color:#fff;border-color:var(--koke)}.opt.no{background:var(--hot);color:#fff;border-color:var(--hot)}
.fb{margin-top:10px;font-size:14px;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
/* 게이트 */
.gate{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.gate[hidden]{display:none}
.gate .logo{font-family:var(--f-ja);font-size:58px;border:1px solid var(--rule);outline:1px solid var(--rule);outline-offset:-6px;background:var(--sheet);width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.gate h1{margin:10px 0 0;font-size:26px}.gate .sub{color:var(--muted);font-family:var(--f-ja)}
.kakao{background:#FEE500;color:#191600;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:center;margin-top:14px;min-width:260px;justify-content:center}
.kakao svg{width:20px;height:20px}
.foot{font-size:12px;color:var(--muted);margin-top:24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot .lo{margin-left:auto;border:1px solid var(--line);background:var(--ghost);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="logo">言</div>
  <h1 id="gtitle">일본어 성경 읽기</h1>
  <div class="sub" id="gsub">日韓対訳で読む聖書</div>
  <div class="note" id="gmsg"></div>
  <button class="kakao" id="gkk"></button>
  <div class="note" id="gfine" style="margin-top:18px"></div>
  <button class="btn" id="glang" style="margin-top:6px;padding:5px 12px;font-size:13px"></button>
</div>
<div class="wrap">
  <div class="top"><div class="tabs">
    <button class="tab" id="t-home"></button>
    <button class="tab" id="t-read" aria-selected="true"></button>
    <button class="tab" id="t-rev"><span id="t-rev-l"></span><i class="dot" id="rdot" hidden></i></button>
  </div></div>

  <section class="view" id="v-home" hidden><div id="home"></div></section>

  <section class="view" id="v-read">
    <div class="rhd"><b id="rtitle"></b><button class="btn" id="lang" style="padding:4px 10px;font-size:22px;line-height:1" aria-label="언어 / 言語"></button><select id="vsel" aria-label="절 고르기"></select></div>
    <div class="prog"><i id="rprog"></i></div>
    <div class="vcard" id="vcard"></div>
    <div class="leg" id="leg"></div>
    <div class="copy" id="copy"></div>
  </section>

  <section class="view" id="v-rev" hidden>
    <div class="seg"><button class="btn" id="rm-k" aria-pressed="true"></button><button class="btn" id="rm-w" aria-pressed="false"></button><button class="btn" id="rm-s" aria-pressed="false"></button></div>
    <div id="rev"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<div class="pop" id="pop" hidden><div class="pcard" id="pcard"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SB_URL='https://qfypowruejziftranphu.supabase.co',SB_KEY='sb_publishable_ydyXHH4TPkBbMaWhgrZqKg_ZEboa29J';
const KK='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>';
const BOOKS={jhn:{ko:'요한복음서',ja:'ヨハネの福音書',ks:'요한복음서',js:'ヨハネ',yv:'JHN'}};
const bname=b=>LANG==='ja'?b.ja:b.ko;
const bshort=b=>LANG==='ja'?b.js:b.ks;
const chs=n=>L(n+'장','第'+n+'章');
const IVL=[0,1,3,7,30];const IVLK=['오늘','1일','3일','7일','1달'],IVLJ=['今日','1日','3日','7日','1か月'];let IVL_L=IVLK;
const CJK=/[㐀-鿿々]/;
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
let TODAY=iso(new Date());const refreshToday=()=>{TODAY=iso(new Date())};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let LANG='ko';try{LANG=localStorage.getItem('jpbible-lang')||((navigator.language||'').startsWith('ja')?'ja':'ko')}catch(e){}
const L=(ko,ja)=>LANG==='ja'?ja:ko;
let sb=null,user=null,KJ={},U=[],WD=[],book='jhn',ch=1,cur=0,furi=true,acol=true,asel=0;
let P={rd:{},srs:{},words:{},sent:{},log:{}};
try{const s=JSON.parse(localStorage.getItem('jpbible-pref')||'{}');furi=s.furi!==false;acol=s.acol!==false;cur=s.cur||0}catch(e){}
const savePref=()=>{try{localStorage.setItem('jpbible-pref',JSON.stringify({furi,cur,acol}))}catch(e){}};

/* ---------- 토큰 ---------- */
const tk=t=>typeof t==='string'?{s:t}:{s:t[0],r:t[1]||'',b:t[2]||'',br:t[3]||''};
function rubyOf(s,r){ // 표면형 s(한자+오쿠리가나)에 읽기 r을 한자 부분에만 붙인다
  if(!r||!CJK.test(s))return [[s,'']];
  const m=s.match(/^(.*?)([ぁ-ゖ]*)$/);const head=m[1],tail=m[2];
  let rr=r;if(tail&&rr.endsWith(tail))rr=rr.slice(0,-tail.length);
  const out=[[head,rr]];if(tail)out.push([tail,'']);return out}
function kspan(c){if(!CJK.test(c)||c==='々')return esc(c);const k=KJ[c];return `<span class="k ${k&&k.busu?'':'n'}" data-k="${c}">${c}</span>`}
function verseHTML(u){return u.toks.map(t0=>{const t=tk(t0);
    const inner=rubyOf(t.s,t.r).map(([a,b])=>b?`<ruby>${[...a].map(kspan).join('')}<rt>${esc(b)}</rt></ruby>`:[...a].map(kspan).join('')).join('');
    return t.b?`<span class="w" data-w="${esc(t.b)}">${inner}</span>`:inner}).join('')}
const uid=u=>u.id;
const vlabel=u=>u.v1===u.v2?`${u.ch}:${u.v1}`:`${u.ch}:${u.v1}-${u.v2}`;
const kanjiOf=u=>[...new Set([...u.jp].filter(c=>CJK.test(c)&&c!=='々'&&KJ[c]))];
const wordsOf=u=>[...new Set(u.toks.map(tk).filter(t=>t.b).map(t=>t.b))].filter(w=>WD.find(x=>x.w===w));

function applyLang(){document.documentElement.lang=LANG;IVL_L=LANG==='ja'?IVLJ:IVLK;
  $('t-home').textContent=L('홈','ホーム');$('t-read').textContent=L('읽기','読む');$('t-rev-l').textContent=L('복습','復習');

function next(){Q=queue.length?makeQ(queue[0]):null;renderRev()}
function grade(ok){const key=queue.shift();done++;if(!window.__prac){const s=store()[key];
    if(ok){s.stage++;s.last=TODAY;s.due=s.stage>=5?'9999-12-31':addDays(TODAY,IVL[s.stage])}else{s.stage=0;s.last=TODAY;s.due=TODAY;queue.push(key)}act();save();updDot()}
  else if(!ok)queue.push(key);next()}
function blankSent(u,surf){let html=u.jp;const i=html.indexOf(surf);return esc(html.slice(0,i))+'<mark>＿＿</mark>'+esc(html.slice(i+surf.length))}
function renderRev(){refreshToday();const el=$('rev'),s=store(),nm=LANG==='ja'?{k:'漢字',w:'単語',s:'文'}[rm]:{k:'한자',w:'단어',s:'문장'}[rm];
  if(!Q){const d=dueOf(s),all=Object.keys(s);
    el.innerHTML=`<div class="ivl">${IVL_L.map(x=>`<span>${x}</span>`).join('')}</div><div class="empty">${done?`<b>${L(done+'문제 끝!','全'+done+'問 終了!')}</b>`:''}
      <div>${d.length?L(`오늘 복습할 ${nm} ${d.length}개`,`今日の復習：${nm} ${d.length}`):all.length?L(`오늘 복습할 ${nm}이 없어요.`,`今日復習する${nm}はありません。`):L('읽기에서 「읽었어요」를 누르면 그 절의 '+nm+'이 여기로 와요.','「読む」で「読みました」を押すと、その節の'+nm+'がここに入ります。')}</div>
      ${d.length?'<button class="btn pri" id="rgo">'+L('복습 시작','復習を始める')+'</button>':''}${all.length?'<button class="btn" id="rprac">'+L('연습하기 (기록 안 남음)','練習する（記録なし）')+'</button>':''}
      <div class="note">${rm==='s'?L('1~7일 단계는 절 빈칸, 1달 단계부터는 ふりがな 없이 통째로 읽고 스스로 채점해요.','1〜7日の段階は節の穴埋め、1か月の段階からはふりがななしで通読し、自分で採点します。'):L('맞히면 1일 → 3일 → 7일 → 1달로 간격이 늘고, 틀리면 오늘 다시 나와요.','正解すると間隔が1日 → 3日 → 7日 → 1か月と延び、間違えると今日もう一度出ます。')}</div></div>`;
    if($('rgo'))$('rgo').onclick=()=>start(false);if($('rprac'))$('rprac').onclick=()=>start(true);return}
  const st=window.__prac?null:s[Q.key].stage;
  const head=`<div class="ivl">${IVL_L.map((x,i)=>`<span class="${st===i?'cur':''}">${x}</span>`).join('')}<span style="margin-left:auto;border:0">${window.__prac?L('연습','練習'):L('남은 ','残り ')+queue.length}</span></div>`;
  if(Q.type==='sread'){el.innerHTML=head+`<div class="q"><div class="ql">${L('ふりがな 없이 소리 내어 읽어 보세요','ふりがななしで声に出して読んでみましょう')} (${vlabel(Q.u)})</div><div class="qs">${esc(Q.u.jp)}</div><div id="sans"></div>
      <div class="ctl"><button class="btn pri" id="sshow">${L('읽기 확인','読みを確認')}</button></div></div>`;
    $('sshow').onclick=()=>{$('sans').innerHTML=`<div class="jp" style="font-size:19px">${verseHTML(Q.u)}</div>${Q.u.ko?`<div class="ko">${esc(Q.u.ko)}</div>`:''}`;
      $('sshow').parentNode.innerHTML='<button class="btn shu" id="sno">'+L('막혔어요','つまった')+'</button><button class="btn ok" id="sok">'+L('읽었어요','読めた')+'</button>';$('sno').onclick=()=>grade(false);$('sok').onclick=()=>grade(true)};return}
  let q='',cls='';
  if(Q.type==='kmean'){q=`<div class="ql">${L('이 한자의 뜻은?','この漢字の韓国語の意味は？')}</div><div class="qk">${Q.key}</div>`}
  if(Q.type==='kchar'){q=`<div class="ql">${L('이 뜻의 한자는?','この意味の漢字は？')}</div><div class="qw" style="font-family:var(--f-ko)">${esc(KJ[Q.key].hun)}</div>`;cls='k'}
  if(Q.type==='read'){q=`<div class="ql">${L('표시한 말을 어떻게 읽을까요?','印の言葉の読みは？')} (${vlabel(Q.u)})</div><div class="qs">${esc(Q.u.jp).split(esc(Q.t.s)).join('<mark>'+esc(Q.t.s)+'</mark>')}</div>`;cls='ja'}
  if(Q.type==='wmean'){q=`<div class="ql">${L('이 단어의 뜻은?','この単語の韓国語は？')}</div><div class="qw">${esc(Q.w.w)}</div><div class="ql">${esc(Q.w.r)}</div>`}
  if(Q.type==='wrev'){q=`<div class="ql">${L('이 뜻의 일본어 단어는?','この韓国語に当たる日本語は？')}</div><div class="qw" style="font-family:var(--f-ko)">${esc(Q.w.ko)}</div>`;cls='ja'}
  if(Q.type==='kcloze'){q=`<div class="ql">${L('한국어 빈칸에 들어갈 말은?','韓国語の空欄に入る言葉は？')} (${vlabel(Q.u)})</div><div class="qs" style="font-family:var(--f-ko)">${Q.u.al.k.map(x=>typeof x==='string'?esc(x):x[1]===Q.gid?'<mark>＿＿</mark>':esc(x[0])).join('')}</div><div class="ql" style="font-family:var(--f-ja)">${esc(Q.u.jp)}</div>`}
  if(Q.type==='wread'){q=`<div class="ql">${L('이 단어를 어떻게 읽을까요?','この単語の読みは？')}</div><div class="qw">${esc(Q.w.w)}</div><div class="ql">${esc(Q.w.ko)}</div>`;cls='ja'}
  if(Q.type==='cloze'||Q.type==='scloze'){q=`<div class="ql">${L('빈칸에 들어갈 말은?','空欄に入る言葉は？')} (${vlabel(Q.u)})</div><div class="qs">${blankSent(Q.u,Q.surf)}</div>${Q.u.ko?`<div class="ql">${esc(Q.u.ko)}</div>`:''}`;cls='ja'}
  el.innerHTML=head+`<div class="q">${q}</div><div class="opts">${Q.opts.map((o,i)=>`<button class="opt ${cls}" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;el.dataset.lock=1;const ok=Q.opts[+b.dataset.i]===Q.ans;
    el.querySelectorAll('.opt').forEach(x=>{if(Q.opts[+x.dataset.i]===Q.ans)x.classList.add('ok')});if(!ok)b.classList.add('no');
    const u=Q.u||U.find(u=>u.jp.includes(Q.key)||u.toks.map(tk).some(t=>t.b===Q.key));
    $('fb').innerHTML=`<b>${ok?L('맞았어요','正解'):L('다시 볼게요','もう一度')}</b>${u?`<div class="jp" style="font-size:18px;line-height:2.1">${verseHTML(u)}</div><div class="note">${vlabel(u)}${u.ko?' · '+esc(u.ko):''}</div>`:''}<div class="ctl"><button class="btn pri" id="nx">${L('다음 →','次へ →')}</button></div>`;
    $('nx').onclick=()=>{el.dataset.lock='';grade(ok)}})}
['k','w','s'].forEach(m=>$('rm-'+m).onclick=()=>{rm=m;['k','w','s'].forEach(x=>$('rm-'+x).setAttribute('aria-pressed',x===m));Q=null;done=0;renderRev()});

/* ---------- 홈 ---------- */
function streak(){let n=0;const d=new Date();if(!P.log[iso(d)])d.setDate(d.getDate()-1);while(P.log[iso(d)]){n++;d.setDate(d.getDate()-1)}return n}
function fopen(){try{return localStorage.getItem('jpbible-fold-'+book+ch)==='1'}catch(e){return false}}
function renderHome(){refreshToday();const m=user?(user.user_metadata||{}):{};const nm=m.name||m.nickname||'';
  const rd=U.filter(u=>P.rd[uid(u)]).length,due=dueOf(P.srs).length+dueOf(P.words).length+dueOf(P.sent).length;
  const nxt=U.findIndex(u=>!P.rd[uid(u)]);
  $('home').innerHTML=`<div class="hi">${nm?esc(nm)+L(' 님, ','さん、'):''}${L('오늘도 말씀과 함께','今日もみことばと共に')}<small>${bname(BOOKS[book])} ${chs(ch)} · ${rd}/${U.length} ${L('읽음','読了')}</small></div>
    <div class="st3"><div class="st"><b>${rd}</b><span>${L('읽은 절','読んだ節')}</span></div><div class="st"><b style="color:var(--shu)">${due}</b><span>${L('오늘 복습','今日の復習')}</span></div><div class="st"><b style="color:var(--ai)">${streak()}</b><span>${L('연속일','連続日数')}</span></div></div>
    <div class="ctl"><button class="btn pri" id="hgo">${nxt<0?L(ch+'장 다 읽었어요 — 처음부터','第'+ch+'章を読み終えました — 最初から'):L('이어서 읽기 · ','続きを読む · ')+vlabel(U[nxt])}</button>${due?'<button class="btn" id="hrv">'+L('복습','復習')+' ('+due+')</button>':''}</div>
    <details class="card fold" id="hfold"${fopen()?' open':''}><summary><span>${bname(BOOKS[book])} ${chs(ch)}</span><small>${rd}/${U.length}</small></summary><div class="vgrid">${U.map((u,i)=>`<button class="${P.rd[uid(u)]?'r':''} ${i===cur?'cur':''}" data-i="${i}">${u.v1}${u.v2!==u.v1?'-'+u.v2:''}</button>`).join('')}</div></details>
    <div class="card"><h3>${L('익힌 것','学んだもの')}</h3><div>${L('한자','漢字')} ${Object.keys(P.srs).length} · ${L('단어','単語')} ${Object.keys(P.words).length} · ${L('문장','文')} ${Object.keys(P.sent).length}</div></div>`;
  $('hgo').onclick=()=>{cur=nxt<0?0:nxt;savePref();show('read')};if($('hrv'))$('hrv').onclick=()=>{rm=dueOf(P.srs).length?'k':dueOf(P.words).length?'w':'s';['k','w','s'].forEach(x=>$('rm-'+x).setAttribute('aria-pressed',x===rm));show('rev')};
  $('hfold').ontoggle=e=>{try{localStorage.setItem('jpbible-fold-'+book+ch,e.target.open?'1':'0')}catch(x){}};
  $('home').querySelectorAll('.vgrid button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;savePref();show('read')})}

/* ---------- 화면 ---------- */
let view='read';
function show(v){view=v;['home','read','rev'].forEach(x=>{$('t-'+x).setAttribute('aria-selected',x===v);$('v-'+x).hidden=x!==v});
  if(v==='home')renderHome();if(v==='read')renderRead();if(v==='rev'){Q=null;renderRev()};scrollTo({top:0})}
$('t-home').onclick=()=>show('home');$('t-read').onclick=()=>show('read');$('t-rev').onclick=()=>show('rev');

/* ---------- 저장 ---------- */
function act(){P.log[TODAY]=(P.log[TODAY]||0)+1}
let pushT=null;
function save(){try{localStorage.setItem('jpbible-p-'+(user?user.id:'x'),JSON.stringify(P))}catch(e){}
  if(!sb||!user)return;clearTimeout(pushT);pushT=setTimeout(async()=>{await sb.from('bible_progress').upsert({user_id:user.id,...P,updated_at:new Date().toISOString()})},1000)}
async function loadAll(){
  const [k,u,w,p]=await Promise.all([fetch('bible-kanji.json',{cache:'no-cache'}).then(r=>r.json()),
    sb.from('bible_units').select('id,book,ch,v1,v2,ord,jp,toks,ko,al').eq('book',book).eq('ch',ch).order('ord'),
    sb.from('bible_meta').select('data').eq('id',`${book}.${ch}.words`).maybeSingle(),
    sb.from('bible_progress').select('rd,srs,words,sent,log').eq('user_id',user.id).maybeSingle()]);
  KJ=k;if(u.error||!u.data||!u.data.length)return false;U=u.data;NOTES={};U.forEach(x=>{if(x.al&&x.al.notes)for(const k in x.al.notes)if(!NOTES[k])NOTES[k]=x.al.notes[k]});WD=(w.data&&w.data.data)||[];
  try{const l=JSON.parse(localStorage.getItem('jpbible-p-'+user.id)||'null');if(l)P=l}catch(e){}
  if(p.data){for(const f of['rd','srs','words','sent','log'])P[f]={...(p.data[f]||{}),...(P[f]||{})}}
  if(cur>=U.length)cur=0;return true}
function renderFoot(){const m=user.user_metadata||{};$('foot').innerHTML=`<span><b>${esc(m.name||m.nickname||'')}</b>${L(' 님 · 기록이 계정에 저장돼요','さん · 記録はアカウントに保存されます')}</span><button class="lo" id="lo">${L('로그아웃','ログアウト')}</button>`;
  $('lo').onclick=async()=>{await sb.auth.signOut();location.reload()}}
async function onUser(){const g=$('gate');
  if(!user){g.hidden=false;$('gkk').hidden=false;applyLang();return}
  $('gkk').hidden=true;$('gmsg').textContent=L('불러오는 중…','読み込み中…');
  const ok=await loadAll();
  if(!ok){$('gmsg').innerHTML=L('이 앱은 아직 개인 학습용이라 허락된 계정만 열려요.','このアプリは現在個人学習用のため、許可されたアカウントのみ利用できます。');$('gkk').hidden=false;$('gkk').dataset.mode='other';$('gkk').innerHTML=L('다른 계정으로 로그인','別のアカウントでログイン');$('gkk').onclick=async()=>{await sb.auth.signOut();login()};return}
  g.hidden=true;renderFoot();updDot();show('read')}
function login(){sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+location.pathname}})}
$('gkk').onclick=login;
try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  let first=true;sb.auth.onAuthStateChange((ev,ses)=>{const was=user&&user.id;user=ses?ses.user:null;
    if(ev==='SIGNED_IN'&&/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname);
    if(first||(user&&user.id)!==was){first=false;setTimeout(onUser,0)}})}
catch(e){$('gmsg').textContent=L('로그인 서버에 연결하지 못했어요. 새로고침해 주세요.','ログインサーバーに接続できません。再読み込みしてください。')}
$('glang').onclick=()=>setLang(LANG==='ja'?'ko':'ja');applyLang();
</script>
</body>
</html>
